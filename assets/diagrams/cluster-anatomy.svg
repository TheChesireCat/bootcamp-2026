<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" font-family="-apple-system, Inter, Helvetica, Arial, sans-serif">
  <style>
    .frame { fill: none; stroke: #6b7280; stroke-width: 2.5; }
    .name  { font-size: 26px; font-weight: 800; fill: #111; }
    .node  { fill: #ffffff; stroke: #6b7280; stroke-width: 2.5; }
    .cyl   { fill: #ffffff; stroke: #6b7280; stroke-width: 2.5; }
    .lbl   { font-size: 19px; fill: #111; text-anchor: middle; }
    .conn  { stroke: #6b7280; stroke-width: 2.5; fill: none; }
    .ssh   { stroke: #34a06f; stroke-width: 5; }
    .sshlbl{ font-size: 18px; fill: #34a06f; font-weight: 700; }
    .user  { fill: none; stroke: #6b7280; stroke-width: 3; }
  </style>

  <!-- Explorer frame -->
  <rect class="frame" x="40" y="20" width="680" height="440" rx="16"/>
  <text class="name" x="66" y="58">Explorer</text>

  <!-- File System (cylinder) -->
  <path class="cyl" d="M310,92 a70,18 0 0 1 140,0 v48 a70,18 0 0 1 -140,0 z"/>
  <ellipse class="cyl" cx="380" cy="92" rx="70" ry="18"/>
  <text class="lbl" x="380" y="128">File System</text>

  <!-- link fs -> network -->
  <line class="conn" x1="380" y1="158" x2="380" y2="204"/>

  <!-- Network -->
  <rect class="node" x="318" y="204" width="124" height="56" rx="28"/>
  <text class="lbl" x="380" y="238">Network</text>

  <!-- bus -->
  <line class="conn" x1="380" y1="260" x2="380" y2="300"/>
  <line class="conn" x1="190" y1="300" x2="570" y2="300"/>
  <line class="conn" x1="190" y1="300" x2="190" y2="330"/>
  <line class="conn" x1="317" y1="300" x2="317" y2="330"/>
  <line class="conn" x1="444" y1="300" x2="444" y2="330"/>
  <line class="conn" x1="570" y1="300" x2="570" y2="330"/>

  <!-- nodes -->
  <rect class="node" x="140" y="330" width="100" height="66" rx="8"/>
  <rect class="node" x="267" y="330" width="100" height="66" rx="8"/>
  <rect class="node" x="394" y="330" width="100" height="66" rx="8"/>
  <rect class="node" x="520" y="330" width="100" height="66" rx="8"/>

  <text class="lbl" x="317" y="422">Compute nodes</text>
  <text class="lbl" x="570" y="422">Login node</text>

  <!-- SSH down to user -->
  <line class="ssh" x1="570" y1="396" x2="570" y2="490"/>
  <text class="sshlbl" x="588" y="448">SSH</text>

  <!-- user -->
  <circle class="user" cx="570" cy="512" r="14"/>
  <path class="user" d="M548,552 a22,22 0 0 1 44,0"/>
</svg>

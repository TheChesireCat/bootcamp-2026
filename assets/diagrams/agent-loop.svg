<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="-apple-system, Inter, Helvetica, Arial, sans-serif">
  <style>
    .you  { fill: #eef1f6; stroke: #6b7280; stroke-width: 2.5; }
    .step { fill: #ffffff; stroke: #1a4fd6; stroke-width: 2.5; }
    .lbl  { font-size: 21px; fill: #111; text-anchor: middle; }
    .lblb { font-size: 21px; fill: #1a4fd6; font-weight: 700; text-anchor: middle; }
    .arr  { stroke: #6b7280; stroke-width: 2.5; fill: none; }
    .loop { stroke: #e8543f; stroke-width: 2.5; fill: none; }
    .looplbl { font-size: 17px; fill: #e8543f; text-anchor: middle; }
  </style>

  <!-- boxes -->
  <rect class="you"  x="16"  y="150" width="150" height="66" rx="10"/>
  <text class="lbl"  x="91"  y="190">a goal</text>

  <rect class="step" x="230" y="150" width="140" height="66" rx="10"/>
  <text class="lblb" x="300" y="190">Plan</text>

  <rect class="step" x="430" y="150" width="140" height="66" rx="10"/>
  <text class="lblb" x="500" y="190">Act</text>

  <rect class="step" x="630" y="150" width="140" height="66" rx="10"/>
  <text class="lblb" x="700" y="190">Check</text>

  <rect class="you"  x="834" y="150" width="150" height="66" rx="10"/>
  <text class="lbl"  x="909" y="190">review</text>

  <!-- forward arrows: tails at each box's right edge, heads stopping at the next box's left edge -->
  <line class="arr" x1="166" y1="183" x2="218" y2="183"/><polygon points="218,177 230,183 218,189" fill="#6b7280"/>
  <line class="arr" x1="370" y1="183" x2="418" y2="183"/><polygon points="418,177 430,183 418,189" fill="#6b7280"/>
  <line class="arr" x1="570" y1="183" x2="618" y2="183"/><polygon points="618,177 630,183 618,189" fill="#6b7280"/>
  <line class="arr" x1="770" y1="183" x2="822" y2="183"/><polygon points="822,177 834,183 822,189" fill="#6b7280"/>

  <!-- loop back Check -> Plan: line ends at the arrowhead base, tip at Plan's top edge -->
  <path class="loop" d="M700,150 C700,80 300,80 300,138"/>
  <polygon points="294,138 300,150 306,138" fill="#e8543f"/>
  <text class="looplbl" x="500" y="78">repeat until it works</text>
</svg>
